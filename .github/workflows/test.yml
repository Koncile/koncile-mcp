name: test

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes the run in flight.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python claims. Testing only the newest would
        # let a 3.10-incompatible change ship against our own metadata.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        env:
          # config.from_env() exits if this is unset; the value is never used
          # against a real API here.
          KONCILE_API_KEY: sk-ci-not-a-real-key
        run: pytest -q
